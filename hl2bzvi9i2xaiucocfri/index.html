<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="搜尋統計">
  <title>搜尋統計</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./stats-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./stats-icon-180.png">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f4f7fb;color:#172033}body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(92vw,380px);background:#fff;border:1px solid #e6edf5;border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 18px 45px rgba(15,23,42,.10)}.logo{width:78px;height:78px;margin:0 auto 16px}.title{font-size:22px;font-weight:800}.sub{font-size:14px;color:#64748b;margin-top:8px;line-height:1.6}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2563eb;margin-right:7px;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.35}}a{display:inline-block;margin-top:18px;color:#2563eb;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./stats-icon.svg" alt="">
    <div class="title">搜尋統計</div>
    <div class="sub"><span class="dot"></span>正在開啟私人統計後台<br>Google 會確認你的登入權限</div>
    <a id="manual" href="https://script.google.com/macros/s/AKfycbzDXc2Tz1EYKLYw7F22dIKB1i2HTccAxXcqKEWfnMYfetB71UgMp__dA-_Bpnp2aaE/exec">若沒有自動開啟，點這裡</a>
  </main>
  <script>
    const target='https://script.google.com/macros/s/AKfycbzDXc2Tz1EYKLYw7F22dIKB1i2HTccAxXcqKEWfnMYfetB71UgMp__dA-_Bpnp2aaE/exec';
    setTimeout(()=>location.replace(target),650);
  </script>
</body>
</html>
