<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>搜尋總表</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#007bff">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; margin: 0; }
    input[type="text"] {
      width: 100%; padding: 15px; margin-bottom: 20px; font-size: 20px;
      border: 2px solid #007bff; border-radius: 8px; background-color: #f0f8ff;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus { border-color: #0056b3; outline: none; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    tr:hover { background-color: #f9f9f9; }
    mark { background-color: transparent; color: red; font-weight: bold; }
    #status { margin: 8px 0 16px; color: #666; display: none; }
    #versionInfo { margin: 18px 0 4px; text-align: center; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h2>搜尋總表</h2>
  <input type="text" id="searchInput" placeholder="請輸入關鍵字" autocomplete="off">
  <div id="status"></div>
  <table id="data-table">
    <thead><tr><th>樓層</th><th>櫃子編號</th><th>內容物</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="versionInfo">版本 2.0｜資料更新：2026-08-18</div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.querySelector('#data-table tbody');
    const statusEl = document.getElementById('status');
    let records = [];

    function appendHighlighted(cell, text, keyword) {
      cell.textContent = '';
      if (!keyword) {
        cell.textContent = text;
        return;
      }
      const lowerText = text.toLowerCase();
      const lowerKeyword = keyword.toLowerCase();
      let start = 0;
      let pos;
      while ((pos = lowerText.indexOf(lowerKeyword, start)) !== -1) {
        cell.append(document.createTextNode(text.slice(start, pos)));
        const mark = document.createElement('mark');
        mark.textContent = text.slice(pos, pos + keyword.length);
        cell.append(mark);
        start = pos + keyword.length;
      }
      cell.append(document.createTextNode(text.slice(start)));
    }

    function render() {
      const keyword = searchInput.value.trim();
      const lowerKeyword = keyword.toLowerCase();
      const fragment = document.createDocumentFragment();

      for (const record of records) {
        const values = [record.floor, record.cabinet, record.contents];
        if (lowerKeyword && !values.join(' ').toLowerCase().includes(lowerKeyword)) continue;
        const tr = document.createElement('tr');
        for (const value of values) {
          const td = document.createElement('td');
          appendHighlighted(td, value, keyword);
          tr.append(td);
        }
        fragment.append(tr);
      }

      tableBody.replaceChildren(fragment);
    }

    async function loadData() {
      try {
        const response = await fetch('./data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        records = await response.json();
        render();
      } catch (error) {
        statusEl.style.display = 'block';
        statusEl.textContent = '資料載入失敗，請確認網路後重新開啟。';
        console.error(error);
      }
    }

    searchInput.addEventListener('input', render);
    loadData();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
