<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>搜尋總表</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#007bff">
  <script src="./analytics.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; margin: 0; }
    input[type="text"] {
      width: 100%; padding: 15px; margin-bottom: 20px; font-size: 20px;
      border: 2px solid #007bff; border-radius: 8px; background-color: #f0f8ff;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus { border-color: #0056b3; outline: none; }
    table {
      border-collapse: collapse;
      width: 100%;
      table-layout: fixed;
      background-color: #fff;
    }
    th, td {
      border: 1px solid #d9d9d9;
      padding: 10px 8px;
      vertical-align: middle;
    }
    th {
      background-color: #f3f3f3;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
    th:nth-child(1), th:nth-child(2) {
      font-size: 15px;
      white-space: nowrap;
      word-break: keep-all;
    }
    th:nth-child(1), td:nth-child(1) { width: 15%; }
    th:nth-child(2), td:nth-child(2) { width: 20%; }
    th:nth-child(3), td:nth-child(3) { width: 65%; }
    td:nth-child(1) {
      padding-left: 4px;
      padding-right: 4px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      white-space: normal;
      word-break: normal;
      overflow-wrap: anywhere;
    }
    td:nth-child(2) {
      padding-left: 4px;
      padding-right: 4px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
    }
    td:nth-child(3) {
      font-size: 15.5px;
      line-height: 1.55;
      text-align: left;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .two-line {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 100%;
      text-align: center;
    }
    .two-line > span {
      display: block;
      white-space: nowrap;
    }
    tr:hover { background-color: #f9f9f9; }
    mark { background-color: transparent; color: red; font-weight: bold; }
    #status { margin: 8px 0 16px; color: #666; display: none; }
    #versionInfo { margin: 18px 0 4px; text-align: center; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <h2>搜尋總表</h2>
  <input type="text" id="searchInput" placeholder="搜尋名稱（多個用空格或、分開）" autocomplete="off">
  <div id="status"></div>
  <table id="data-table">
    <thead><tr><th>樓層</th><th>位置</th><th>內容物</th></tr></thead>
    <tbody></tbody>
  </table>
  <div id="versionInfo">版本 2.2｜資料更新：2026-09-04</div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.querySelector('#data-table tbody');
    const statusEl = document.getElementById('status');
    let records = [];
    const pinyinCache = new Map();

    function loadPinyinHelper() {
      const script = document.createElement('script');
      script.src = './pinyin-pro-3.28.1.min.js';
      script.async = true;
      script.onload = () => {
        if (searchInput.value.trim()) render();
      };
      script.onerror = () => console.warn('拼音搜尋輔助載入失敗，改用本機近似搜尋。');
      document.head.appendChild(script);
    }

    function normalizeHighlightTerms(keywords) {
      const values = Array.isArray(keywords) ? keywords : [keywords];
      const seen = new Set();
      return values
        .map(value => String(value || '').trim())
        .filter(value => {
          const key = value.toLowerCase();
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function appendHighlightedNodes(parent, text, keywords) {
      const value = String(text);
      const terms = normalizeHighlightTerms(keywords);
      if (!terms.length) {
        parent.append(document.createTextNode(value));
        return;
      }

      const lowerText = value.toLowerCase();
      const ranges = [];
      terms.forEach(term => {
        const lowerTerm = term.toLowerCase();
        let start = 0;
        let pos;
        while ((pos = lowerText.indexOf(lowerTerm, start)) !== -1) {
          ranges.push([pos, pos + term.length]);
          start = pos + Math.max(term.length, 1);
        }
      });

      if (!ranges.length) {
        parent.append(document.createTextNode(value));
        return;
      }

      ranges.sort((a, b) => a[0] - b[0] || b[1] - a[1]);
      const merged = [];
      ranges.forEach(range => {
        const last = merged[merged.length - 1];
        if (last && range[0] <= last[1]) {
          last[1] = Math.max(last[1], range[1]);
        } else {
          merged.push(range.slice());
        }
      });

      let cursor = 0;
      merged.forEach(([start, end]) => {
        parent.append(document.createTextNode(value.slice(cursor, start)));
        const mark = document.createElement('mark');
        mark.textContent = value.slice(start, end);
        parent.append(mark);
        cursor = end;
      });
      parent.append(document.createTextNode(value.slice(cursor)));
    }

    function appendHighlighted(cell, text, keywords) {
      cell.textContent = '';
      appendHighlightedNodes(cell, text, keywords);
    }

    function appendTwoLinesHighlighted(cell, firstLine, secondLine, keywords) {
      cell.textContent = '';
      const wrapper = document.createElement('span');
      wrapper.className = 'two-line';
      const firstPart = document.createElement('span');
      const secondPart = document.createElement('span');
      appendHighlighted(firstPart, firstLine, keywords);
      appendHighlighted(secondPart, secondLine, keywords);
      wrapper.append(firstPart, secondPart);
      cell.append(wrapper);
    }

    function appendFloorHighlighted(cell, text, keywords) {
      const value = String(text).trim();

      if (value.startsWith('外倉')) {
        const floorPart = value.slice(2).trim();
        if (floorPart) {
          appendTwoLinesHighlighted(cell, '外倉', floorPart, keywords);
          return;
        }
      }

      const match = value.match(/^(\d+F)\s*(.+)$/i);
      if (match) {
        appendTwoLinesHighlighted(cell, match[1], match[2], keywords);
        return;
      }

      appendHighlighted(cell, value, keywords);
    }

    function formatPositionText(text) {
      return String(text).replace(/\(/g, '（').replace(/\)/g, '）');
    }

    function appendPositionHighlighted(cell, text, keywords) {
      const value = formatPositionText(text).trim();
      const match = value.match(/^([^（]+)(（.+）)$/);

      if (match) {
        appendTwoLinesHighlighted(cell, match[1].trim(), match[2].trim(), keywords);
        return;
      }

      appendHighlighted(cell, value, keywords);
    }

    function getDisplayCabinet(record) {
      const floor = String(record.floor).replace(/\s+/g, '').toUpperCase();
      const cabinet = String(record.cabinet).trim().toLowerCase();

      if ((floor === '5F倉庫' && cabinet === '5f') ||
          (floor === '6F倉庫' && cabinet === '6f')) {
        return '整層';
      }

      return record.cabinet;
    }

    function getRecordSearchText(record) {
      return [record.floor, getDisplayCabinet(record), record.contents]
        .join(' ')
        .toLowerCase();
    }

    function uniqueSearchTerms(values) {
      const seen = new Set();
      return values
        .map(value => String(value || '').trim())
        .filter(value => {
          const key = value.toLowerCase();
          if (!key || seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }

    function splitSearchChunk(value) {
      const chunk = String(value || '').trim();
      if (!chunk || !/\s/.test(chunk)) return chunk ? [chunk] : [];

      const lowerChunk = chunk.toLowerCase();
      const hasFullExactMatch = records.some(record =>
        getRecordSearchText(record).includes(lowerChunk)
      );
      return hasFullExactMatch ? [chunk] : chunk.split(/\s+/);
    }

    function getSearchTerms(input) {
      const query = String(input || '').trim();
      if (!query) return [];

      const chunks = query.split(/[,，、;；\r\n]+/);
      return uniqueSearchTerms(chunks.flatMap(splitSearchChunk));
    }

    window.searchToolGetTerms = getSearchTerms;

    function containsChinese(text) {
      return /[\u3400-\u9fff]/.test(text);
    }

    function toPlainPinyin(text) {
      if (!window.pinyinPro || typeof window.pinyinPro.pinyin !== 'function') return '';
      const key = String(text);
      if (pinyinCache.has(key)) return pinyinCache.get(key);
      try {
        const result = window.pinyinPro.pinyin(key, {
          toneType: 'none',
          removeNonZh: true
        }).replace(/\s+/g, '').toLowerCase();
        pinyinCache.set(key, result);
        return result;
      } catch (error) {
        return '';
      }
    }

    function normalizeFuzzy(text) {
      return String(text)
        .normalize('NFKC')
        .toLowerCase()
        .replace(/[^\u3400-\u9fffa-z0-9]/g, '');
    }

    function levenshtein(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;

      let previous = Array.from({ length: b.length + 1 }, (_, i) => i);
      let current = new Array(b.length + 1);

      for (let i = 1; i <= a.length; i++) {
        current[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const cost = a[i - 1] === b[j - 1] ? 0 : 1;
          current[j] = Math.min(
            previous[j] + 1,
            current[j - 1] + 1,
            previous[j - 1] + cost
          );
        }
        [previous, current] = [current, previous];
      }
      return previous[b.length];
    }

    function fuzzySegmentMatches(segment, keyword) {
      const query = normalizeFuzzy(keyword);
      const target = normalizeFuzzy(segment);

      // 兩字詞若只差一字，傳統編輯距離會把大量無關名稱也判為相近。
      // 兩字同音交給拼音比對；三字以上才使用保守的錯字容忍。
      if (!containsChinese(keyword) || query.length < 3 || target.length < 2) return false;

      const maxDistance = query.length >= 5 ? 2 : 1;

      if (target.length < query.length) {
        return levenshtein(target, query) <= maxDistance;
      }

      for (let i = 0; i <= target.length - query.length; i++) {
        const windowText = target.slice(i, i + query.length);
        if (levenshtein(windowText, query) <= maxDistance) return true;
      }
      return false;
    }

    function smartSegmentMatches(segment, keyword) {
      if (!keyword || keyword.length < 2 || !containsChinese(keyword)) return false;

      const lowerSegment = segment.toLowerCase();
      const lowerKeyword = keyword.toLowerCase();
      if (lowerSegment.includes(lowerKeyword)) return true;

      const keywordPinyin = toPlainPinyin(keyword);
      const segmentPinyin = toPlainPinyin(segment);
      if (keywordPinyin && segmentPinyin && segmentPinyin.includes(keywordPinyin)) return true;

      return fuzzySegmentMatches(segment, keyword);
    }

    function contentHasSmartMatch(contents, keyword) {
      return contents.split(/[,，]/).some(part => smartSegmentMatches(part.trim(), keyword));
    }

    function appendSmartHighlighted(cell, text, exactTerms, smartTerms) {
      cell.textContent = '';
      const parts = text.split(/([,，])/);

      for (const part of parts) {
        if (part === ',' || part === '，') {
          cell.append(document.createTextNode(part));
          continue;
        }

        if (!smartTerms.some(term => smartSegmentMatches(part.trim(), term))) {
          appendHighlightedNodes(cell, part, exactTerms);
          continue;
        }

        const leading = (part.match(/^\s*/) || [''])[0];
        const trailing = (part.match(/\s*$/) || [''])[0];
        const coreEnd = part.length - trailing.length;
        const core = part.slice(leading.length, coreEnd);

        cell.append(document.createTextNode(leading));
        if (core) {
          const mark = document.createElement('mark');
          mark.textContent = core;
          cell.append(mark);
        }
        cell.append(document.createTextNode(trailing));
      }
    }

    function getFloorOrderMap(data) {
      const map = new Map();
      data.forEach(record => {
        const key = String(record.floor);
        if (!map.has(key)) map.set(key, map.size);
      });
      return map;
    }

    function getCabinetMeta(text) {
      const value = formatPositionText(text).replace(/\s+/g, '').trim();
      const basic = value.match(/^(前|中|後)（.+）$/);
      if (basic) {
        return { type: 'named', group: '', rank: { '前': 0, '中': 1, '後': 2 }[basic[1]] };
      }

      const corridor = value.match(/^(走廊)（(前|中|後)）$/);
      if (corridor) {
        return { type: 'named', group: corridor[1], rank: { '前': 0, '中': 1, '後': 2 }[corridor[2]] };
      }

      if (/^\d+$/.test(value)) {
        return { type: 'number', group: '', rank: parseInt(value, 10) };
      }

      return { type: 'other', group: value, rank: 0 };
    }

    function sortRecords(data) {
      const floorOrderMap = getFloorOrderMap(data);
      return data
        .map((record, index) => ({ ...record, _index: index }))
        .sort((a, b) => {
          const floorDiff = floorOrderMap.get(String(a.floor)) - floorOrderMap.get(String(b.floor));
          if (floorDiff !== 0) return floorDiff;

          const aMeta = getCabinetMeta(a.cabinet);
          const bMeta = getCabinetMeta(b.cabinet);

          if (aMeta.type === 'named' && bMeta.type === 'named') {
            if (aMeta.group !== bMeta.group) {
              return aMeta.group.localeCompare(bMeta.group, 'zh-Hant');
            }
            return aMeta.rank - bMeta.rank;
          }

          if (aMeta.type === 'number' && bMeta.type === 'number') {
            return aMeta.rank - bMeta.rank;
          }

          return a._index - b._index;
        })
        .map(({ _index, ...record }) => record);
    }

    function getTermStates(terms) {
      const states = terms.map(term => ({
        term,
        lowerTerm: term.toLowerCase(),
        exactMatchIndexes: new Set()
      }));

      records.forEach((record, index) => {
        const searchText = getRecordSearchText(record);
        states.forEach(state => {
          if (searchText.includes(state.lowerTerm)) {
            state.exactMatchIndexes.add(index);
          }
        });
      });

      return states;
    }

    function getRecordMatches(record, index, termStates) {
      const exactTerms = [];
      const smartTerms = [];

      termStates.forEach(state => {
        if (state.exactMatchIndexes.size > 0) {
          if (state.exactMatchIndexes.has(index)) exactTerms.push(state.term);
        } else if (contentHasSmartMatch(record.contents, state.term)) {
          smartTerms.push(state.term);
        }
      });

      return { exactTerms, smartTerms };
    }

    function render() {
      const terms = getSearchTerms(searchInput.value);
      const fragment = document.createDocumentFragment();
      const termStates = getTermStates(terms);

      records.forEach((record, index) => {
        const values = [record.floor, getDisplayCabinet(record), record.contents];
        const { exactTerms, smartTerms } = getRecordMatches(record, index, termStates);

        if (termStates.length && !exactTerms.length && !smartTerms.length) return;

        const tr = document.createElement('tr');

        values.forEach((value, valueIndex) => {
          const td = document.createElement('td');
          if (valueIndex === 0) {
            appendFloorHighlighted(td, value, exactTerms);
          } else if (valueIndex === 1) {
            appendPositionHighlighted(td, value, exactTerms);
          } else if (smartTerms.length) {
            appendSmartHighlighted(td, value, exactTerms, smartTerms);
          } else {
            appendHighlighted(td, value, exactTerms);
          }
          tr.append(td);
        });

        fragment.append(tr);
      });

      tableBody.replaceChildren(fragment);
    }

    async function loadData() {
      try {
        const response = await fetch('./data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        records = sortRecords(data);
        render();
      } catch (error) {
        statusEl.style.display = 'block';
        statusEl.textContent = '資料載入失敗，請確認網路後重新開啟。';
        console.error(error);
      }
    }

    searchInput.addEventListener('input', render);
    loadPinyinHelper();
    loadData();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
