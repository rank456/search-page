name: Migrate search tool v2

on:
  push:
    paths:
      - '.github/workflows/migrate-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert embedded table to data.json and modernize PWA
        shell: python
        run: |
          import re, json, html, zlib, struct, binascii
          from pathlib import Path

          root = Path('.')
          src = (root / 'index.html').read_text(encoding='utf-8')

          pattern = re.compile(r'<tr><td>(.*?)</td><td>(.*?)</td><td>(.*?)</td></tr>', re.S)
          rows = pattern.findall(src)
          if len(rows) < 50:
              raise SystemExit(f'資料列解析異常，只找到 {len(rows)} 列，停止轉換')

          data = []
          for floor, cabinet, contents in rows:
              floor = html.unescape(re.sub(r'<[^>]+>', '', floor)).strip()
              cabinet = html.unescape(re.sub(r'<[^>]+>', '', cabinet)).strip()
              contents = html.unescape(re.sub(r'<[^>]+>', '', contents)).strip()
              items = [x.strip() for x in contents.split(',') if x.strip()]
              data.append({'floor': floor, 'cabinet': cabinet, 'items': items})

          (root / 'data.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          index = r'''<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>搜尋總表</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#007bff">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; margin: 0; }
    input[type="text"] {
      width: 100%; padding: 15px; margin-bottom: 20px; font-size: 20px;
      border: 2px solid #007bff; border-radius: 8px; background-color: #f0f8ff;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus { border-color: #0056b3; outline: none; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    tr:hover { background-color: #f9f9f9; }
    mark { background-color: transparent; color: red; font-weight: bold; }
    #status { margin: 8px 0 16px; color: #666; display: none; }
  </style>
</head>
<body>
  <h2>搜尋總表</h2>
  <input type="text" id="searchInput" placeholder="請輸入關鍵字" autocomplete="off">
  <div id="status"></div>
  <table id="data-table">
    <thead><tr><th>樓層</th><th>櫃子編號</th><th>內容物</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    const searchInput = document.getElementById('searchInput');
    const tableBody = document.querySelector('#data-table tbody');
    const statusEl = document.getElementById('status');
    let records = [];

    function appendHighlighted(cell, text, keyword) {
      cell.textContent = '';
      if (!keyword) {
        cell.textContent = text;
        return;
      }
      const lowerText = text.toLowerCase();
      const lowerKeyword = keyword.toLowerCase();
      let start = 0;
      let pos;
      while ((pos = lowerText.indexOf(lowerKeyword, start)) !== -1) {
        cell.append(document.createTextNode(text.slice(start, pos)));
        const mark = document.createElement('mark');
        mark.textContent = text.slice(pos, pos + keyword.length);
        cell.append(mark);
        start = pos + keyword.length;
      }
      cell.append(document.createTextNode(text.slice(start)));
    }

    function render() {
      const keyword = searchInput.value.trim();
      const lowerKeyword = keyword.toLowerCase();
      const fragment = document.createDocumentFragment();

      for (const record of records) {
        const values = [record.floor, record.cabinet, record.items.join(', ')];
        if (lowerKeyword && !values.join(' ').toLowerCase().includes(lowerKeyword)) continue;
        const tr = document.createElement('tr');
        for (const value of values) {
          const td = document.createElement('td');
          appendHighlighted(td, value, keyword);
          tr.append(td);
        }
        fragment.append(tr);
      }

      tableBody.replaceChildren(fragment);
    }

    async function loadData() {
      try {
        const response = await fetch('./data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        records = await response.json();
        render();
      } catch (error) {
        statusEl.style.display = 'block';
        statusEl.textContent = '資料載入失敗，請確認網路後重新開啟。';
        console.error(error);
      }
    }

    searchInput.addEventListener('input', render);
    loadData();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      });
    }
  </script>
</body>
</html>
'''
          (root / 'index.html').write_text(index, encoding='utf-8')

          manifest = {
              'name': 'Excel搜尋工具',
              'short_name': '搜尋工具',
              'start_url': './index.html',
              'scope': './',
              'display': 'standalone',
              'background_color': '#ffffff',
              'theme_color': '#007bff',
              'icons': [
                  {'src': './icon-192.png', 'sizes': '192x192', 'type': 'image/png', 'purpose': 'any maskable'},
                  {'src': './icon-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'any maskable'}
              ]
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = r'''const CACHE_NAME = 'search-tool-cache-v8';
const APP_SHELL = [
  './',
  './index.html',
  './data.json',
  './manifest.json',
  './icon-192.png',
  './icon-512.png'
];

self.addEventListener('install', event => {
  self.skipWaiting();
  event.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(APP_SHELL)));
});

self.addEventListener('activate', event => {
  event.waitUntil(
    caches.keys()
      .then(names => Promise.all(names.filter(name => name !== CACHE_NAME).map(name => caches.delete(name))))
      .then(() => self.clients.claim())
  );
});

async function networkFirst(request) {
  const cache = await caches.open(CACHE_NAME);
  try {
    const response = await fetch(request, { cache: 'no-store' });
    if (response && response.ok) cache.put(request, response.clone());
    return response;
  } catch (error) {
    const cached = await cache.match(request);
    if (cached) return cached;
    throw error;
  }
}

self.addEventListener('fetch', event => {
  if (event.request.method !== 'GET') return;
  const url = new URL(event.request.url);
  if (url.origin !== self.location.origin) return;

  if (url.pathname.endsWith('/data.json') || event.request.mode === 'navigate') {
    event.respondWith(networkFirst(event.request).catch(() => caches.match('./index.html')));
    return;
  }

  event.respondWith(
    caches.match(event.request).then(cached => cached || fetch(event.request).then(response => {
      if (response && response.ok) {
        const copy = response.clone();
        caches.open(CACHE_NAME).then(cache => cache.put(event.request, copy));
      }
      return response;
    }))
  );
});
'''
          (root / 'service-worker.js').write_text(sw, encoding='utf-8')

          # 產生不依賴外部網站的簡單櫻桃 PNG 圖示。
          def make_png(size, path):
              w = h = size
              pixels = bytearray([255, 255, 255, 255] * (w * h))
              def put(x, y, rgba):
                  if 0 <= x < w and 0 <= y < h:
                      i = (y * w + x) * 4
                      pixels[i:i+4] = bytes(rgba)
              def circle(cx, cy, r, rgba):
                  rr = r * r
                  for y in range(max(0, cy-r), min(h, cy+r+1)):
                      dy = y-cy
                      for x in range(max(0, cx-r), min(w, cx+r+1)):
                          dx = x-cx
                          if dx*dx + dy*dy <= rr:
                              put(x, y, rgba)
              def line(x0, y0, x1, y1, thickness, rgba):
                  steps = max(abs(x1-x0), abs(y1-y0), 1)
                  for s in range(steps+1):
                      x = round(x0 + (x1-x0)*s/steps)
                      y = round(y0 + (y1-y0)*s/steps)
                      circle(x, y, thickness, rgba)
              red = (224, 0, 78, 255)
              green = (0, 135, 110, 255)
              lightgreen = (151, 226, 113, 255)
              circle(int(w*.39), int(h*.61), int(w*.19), red)
              circle(int(w*.62), int(h*.61), int(w*.19), red)
              line(int(w*.39), int(h*.45), int(w*.50), int(h*.22), max(2,int(w*.025)), green)
              line(int(w*.62), int(h*.45), int(w*.50), int(h*.22), max(2,int(w*.025)), green)
              circle(int(w*.44), int(h*.20), int(w*.10), lightgreen)
              # PNG scanlines with filter byte 0
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  start = y*w*4
                  raw.extend(pixels[start:start+w*4])
              def chunk(kind, payload):
                  return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', binascii.crc32(kind + payload) & 0xffffffff)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
              png += chunk(b'IEND', b'')
              Path(path).write_bytes(png)

          make_png(192, root / 'icon-192.png')
          make_png(512, root / 'icon-512.png')
          print(f'成功轉換 {len(data)} 個櫃位資料列')

      - name: Commit migrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json manifest.json service-worker.js robots.txt icon-192.png icon-512.png
          git commit -m "重構搜尋工具資料與離線更新" || exit 0
          git push
